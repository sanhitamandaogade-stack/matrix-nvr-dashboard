# Netlify configuration for the Matrix NVR web client.
# The site is a single ready-built page, so there is no build step.

[build]
  publish = "public"

# Direct links such as /alarms or /devices open the app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'"

# Always fetch the latest page after a new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
