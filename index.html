<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Matrix NVR web client: sign in, monitor cameras, recording, storage and alarms.">
<meta name="theme-color" content="#0d171b">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%230e9aa7%22%2F%3E%3Cg%20fill%3D%22%23fff%22%3E%3Ccircle%20cx%3D%229%22%20cy%3D%229%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%228%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2210%22%20r%3D%222.4%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%2217%22%20r%3D%223.4%22%2F%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2217%22%20r%3D%223.4%22%2F%3E%3Ccircle%20cx%3D%229%22%20cy%3D%2225%22%20r%3D%223.6%22%2F%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2225%22%20r%3D%223.6%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Matrix NVR Web Client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: icon rail + top bar + status banner + 12-col widget grid, 24px page margin; mobile swaps the rail for a hamburger side sheet.
   Tokens: the four Figma Tokens modes, selected with data-nvr on <html>. */
:root,[data-nvr="dark-teal"]{--app:#0d171b;--sf:#172326;--sf2:#24333a;--sf3:#33434b;--hl:#123f44;--ov:#000;--tx:#f1f4f5;--tx2:#b8c4c8;--tx3:#8a9aa1;--txa:#86d5dc;--dis:#63747c;--inbg:#24333a;--inbd:#475861;--inerr:#fca5a5;--bp:#43bbc6;--bpt:#0b2b2f;--bph:#5cc5cf;--ic:#b8c4c8;--ica:#86d5dc;--bs:#24333a;--bd:#33434b;--bst:#63747c;--okf:#4ade80;--okb:#052e16;--okc:#86efac;--wnf:#fbbf24;--wnb:#451a03;--wnc:#fcd34d;--cf:#f87171;--cb:#450a0a;--cc:#fca5a5;--inf:#38bdf8;--infb:#082f49;--inft:#7dd3fc;--brand:#0e9aa7;--shadow:0 1px 2px rgba(0,0,0,.35);--pop:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
[data-nvr="light-teal"]{--app:#f1f4f5;--sf:#fff;--sf2:#f7fafa;--sf3:#e7ecee;--hl:#d9f4f6;--ov:#0d171b;--tx:#172326;--tx2:#33434b;--tx3:#475861;--txa:#207e87;--dis:#8a9aa1;--inbg:#fff;--inbd:#b8c4c8;--inerr:#991b1b;--bp:#43bbc6;--bpt:#0b2b2f;--bph:#2d9da8;--ic:#33434b;--ica:#2d9da8;--bs:#e7ecee;--bd:#d5dde0;--bst:#8a9aa1;--okf:#16a34a;--okb:#f0fdf4;--okc:#166534;--wnf:#d97706;--wnb:#fffbeb;--wnc:#92400e;--cf:#dc2626;--cb:#fef2f2;--cc:#991b1b;--inf:#0284c7;--infb:#f0f9ff;--inft:#075985;--brand:#0e9aa7;--shadow:0 1px 2px rgba(13,23,27,.06),0 4px 14px rgba(13,23,27,.05);--pop:0 10px 30px rgba(13,23,27,.18);color-scheme:light}
[data-nvr="dark-purple"]{--app:#0d171b;--sf:#172326;--sf2:#24333a;--sf3:#33434b;--hl:#1d0e31;--ov:#000;--tx:#f1f4f5;--tx2:#b8c4c8;--tx3:#8a9aa1;--txa:#d5bfe7;--dis:#63747c;--inbg:#24333a;--inbd:#475861;--inerr:#fca5a5;--bp:#a77bc8;--bpt:#12091f;--bph:#bc9ad7;--ic:#b8c4c8;--ica:#bc9ad7;--bs:#24333a;--bd:#33434b;--bst:#63747c;--okf:#4ade80;--okb:#052e16;--okc:#86efac;--wnf:#fbbf24;--wnb:#451a03;--wnc:#fcd34d;--cf:#f87171;--cb:#450a0a;--cc:#fca5a5;--inf:#38bdf8;--infb:#082f49;--inft:#7dd3fc;--brand:#7b4fa3;--shadow:0 1px 2px rgba(0,0,0,.35);--pop:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
[data-nvr="light-purple"]{--app:#f1f4f5;--sf:#fff;--sf2:#f7fafa;--sf3:#e7ecee;--hl:#e9ddf3;--ov:#0d171b;--tx:#172326;--tx2:#33434b;--tx3:#475861;--txa:#371b5b;--dis:#8a9aa1;--inbg:#fff;--inbd:#b8c4c8;--inerr:#991b1b;--bp:#371b5b;--bpt:#fff;--bph:#56327e;--ic:#33434b;--ica:#56327e;--bs:#e7ecee;--bd:#d5dde0;--bst:#8a9aa1;--okf:#16a34a;--okb:#f0fdf4;--okc:#166534;--wnf:#d97706;--wnb:#fffbeb;--wnc:#92400e;--cf:#dc2626;--cb:#fef2f2;--cc:#991b1b;--inf:#0284c7;--infb:#f0f9ff;--inft:#075985;--brand:#56327e;--shadow:0 1px 2px rgba(13,23,27,.06),0 4px 14px rgba(13,23,27,.05);--pop:0 10px 30px rgba(13,23,27,.18);color-scheme:light}
:root{--gut:24px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--app)}
body{color:var(--tx);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ica);outline-offset:2px}
#app{height:100%}
.ic{flex:none;display:block}
.sp{flex:1}
.mut{color:var(--tx2)}.sm{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sf2)}
.btn.primary{background:var(--bp);border-color:var(--bp);color:var(--bpt)}.btn.primary:hover{background:var(--bph);border-color:var(--bph)}
.btn.danger{background:var(--cf);border-color:var(--cf);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--sf2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--ic);cursor:pointer;flex:none}
.ib:hover{background:var(--sf2);color:var(--tx)}
.inp{width:100%;height:38px;padding:0 12px;border:1px solid var(--inbd);border-radius:8px;background:var(--inbg);color:var(--tx)}
.inp::placeholder{color:var(--tx3)}
.inp:focus{outline:2px solid var(--ica);outline-offset:0;border-color:var(--ica)}
.inp.bad{border-color:var(--inerr)}
.lbl{display:block;font-weight:500;font-size:13px;margin:14px 0 6px}
.err{color:var(--cc);font-size:12px;min-height:16px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.crit{background:var(--cb);color:var(--cc)}.pill.warn{background:var(--wnb);color:var(--wnc)}.pill.ok{background:var(--okb);color:var(--okc)}.pill.info{background:var(--infb);color:var(--inft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bst);flex:none}.dot.good{background:var(--okf)}.dot.bad{background:var(--cf)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.chk input{appearance:none;width:16px;height:16px;border:1px solid var(--bst);border-radius:3px;background:var(--inbg);margin:0;display:grid;place-items:center;cursor:pointer;flex:none}
.chk input:checked{background:var(--bp);border-color:var(--bp)}
.chk input:checked::after{content:'';width:9px;height:5px;border-left:2px solid var(--bpt);border-bottom:2px solid var(--bpt);transform:rotate(-45deg) translate(1px,-1px)}
.chk input:disabled{opacity:.6}
.alert{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--cb);color:var(--cc);font-size:13px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--sf);padding:6px 12px;font-size:13px;cursor:pointer;border-left:1px solid var(--bd)}
.seg button:first-child{border-left:0}.seg button.on{background:var(--bp);color:var(--bpt);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.av{width:32px;height:32px;border-radius:50%;background:var(--hl);color:var(--txa);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.av.s{width:28px;height:28px;font-size:11px}.av.l{width:40px;height:40px;font-size:14px}
.logo{display:block;color:var(--tx3);flex:none}
.logo .b{fill:var(--brand)}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;position:relative}
.lcol{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:40px}
.lh{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.lh h1{font-size:28px;font-weight:600;letter-spacing:.01em}
.lh p{font-size:16px;color:var(--tx2);margin-top:8px}
.lf{width:100%;display:flex;flex-direction:column;gap:20px}
.fg{display:flex;flex-direction:column;gap:8px}
.fg>label{font-weight:500;font-size:14px}
.lf .inp{height:44px;border-radius:6px;font-size:15px}
.pw{position:relative}.pw .inp{padding-right:44px}.pw .ib{position:absolute;right:6px;top:6px}
.fe{color:var(--cc);font-size:12px;margin-top:-2px}
.lgb{width:100%;height:44px;border-radius:6px;font-size:15px;font-weight:600}
.help{font-size:12px;color:var(--tx3);text-align:center}
.devcard{width:100%;display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border:1px solid var(--bs);border-radius:12px}
.devcard small{display:block;color:var(--tx3);font-size:12px}.devcard b{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.copy{font-size:12px;color:var(--tx3);padding-top:24px}
.lthm{position:absolute;top:16px;right:16px}
.demo{position:fixed;left:16px;bottom:16px;margin-bottom:env(safe-area-inset-bottom,0px);max-width:340px;border:1px dashed var(--bst);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--tx2);background:var(--sf);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);z-index:5}
.demo b{color:var(--tx);font-size:13px;font-weight:500}.demob{display:flex;gap:6px;flex-wrap:wrap}
.demo .x{position:absolute;top:6px;right:6px;width:24px;height:24px}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:76px minmax(0,1fr)}
.rail{background:var(--sf);border-right:1px solid var(--bs);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;overflow:auto}
.nv{width:64px;padding:8px 0 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx2);cursor:pointer;border:0;background:none}
.nv svg{color:var(--ic)}
.nv:hover{background:var(--sf2)}.nv.on{background:var(--hl);color:var(--txa);font-weight:500}.nv.on svg{color:var(--ica)}
.nv.demo-n{margin-top:auto;border:1px dashed var(--bst)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:0 var(--gut);height:56px;border-bottom:1px solid var(--bs);background:var(--sf);flex:none}
.hamb{display:none}
.thm{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 8px;border:1px solid var(--bs);border-radius:8px;background:transparent;cursor:pointer;color:var(--tx2);font-size:12px;font-weight:500}
.thm:hover{background:var(--sf2);color:var(--tx)}
.sw{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid var(--bd);display:inline-block}
.bell{position:relative}.bell em{position:absolute;top:0;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--cf);color:#fff;font-size:10px;font-style:normal;font-weight:500;display:grid;place-items:center;padding:0 4px}
.uchip{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:10px;text-align:left;color:var(--tx)}.uchip:hover{background:var(--sf2)}
.uchip b{display:block;font-weight:500;font-size:13px;line-height:1.2}.uchip small{font-size:11px;color:var(--tx3)}
.crumbs{display:none}
.strip{display:flex;align-items:center;gap:12px;padding:8px var(--gut);font-size:13px;flex:none;border-bottom:1px solid var(--bs)}
.strip .sd{color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip.crit{background:var(--cb)}.strip.crit .sl,.strip.crit .ib{color:var(--cc)}
.strip.warn{background:var(--wnb)}.strip.warn .sl,.strip.warn .ib{color:var(--wnc)}
.strip.ok{background:var(--okb)}.strip.ok .sl,.strip.ok .ib{color:var(--okc)}
.strip.off{background:var(--sf3)}
.sl{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.spill{display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:5px 12px 5px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.spill.crit{background:var(--cb);color:var(--cc)}.spill.warn{background:var(--wnb);color:var(--wnc)}.spill.off{background:var(--sf3);color:var(--tx)}
.dh{flex:none;background:var(--sf);border-bottom:1px solid var(--bs);padding:14px var(--gut) 0}
.dh1{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dh1 h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.dh1 .ttl{display:flex;align-items:center;gap:8px;min-width:0}
.dh1 .ttl p{font-size:12px;color:var(--tx3)}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upd{font-size:12px;color:var(--tx3)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tab{display:flex;align-items:center;border-bottom:2px solid transparent;color:var(--tx2);white-space:nowrap;flex:none}
.tab.on{border-color:var(--txa);color:var(--txa)}
.tab>button:first-child{border:0;background:none;height:40px;padding:0 4px 0 12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;color:inherit}
.tab .ib{width:26px;height:26px;color:inherit}
.tabadd{border:0;background:none;color:var(--txa);font-weight:500;height:40px;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabadd:disabled{color:var(--tx3);cursor:not-allowed}
.content{flex:1;min-height:0;overflow:auto;padding:var(--gut)}
.hintbar{display:flex;gap:10px;align-items:center;background:var(--hl);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.hintbar>svg{color:var(--ica)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-6{grid-column:span 6}.w-8{grid-column:span 8}.w-12{grid-column:span 12}

/* widgets */
.widget{position:relative;background:var(--sf);border:1px solid var(--bs);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:190px;min-width:0;transition:border-color .12s}
.widget:hover{border-color:var(--ica)}
.widget.wsel{border-color:var(--ica);box-shadow:0 0 0 1px var(--ica),var(--shadow)}
.wh{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 0}
.wt{flex:1;min-width:0}.wt h3{font-size:14px;font-weight:600}.wt p{font-size:12px;color:var(--tx3);margin-top:2px}
.wb{padding:12px 16px 14px;flex:1;min-width:0}
.wfoot{border-top:1px solid var(--bs);padding:9px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.lk{border:0;background:none;color:var(--txa);font-weight:500;font-size:12px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}.lk:hover{text-decoration:underline}
.widget.ld .wb,.widget.ld .wfoot{opacity:.45;pointer-events:none;transition:opacity .15s}
.widget.ld::after{content:'';position:absolute;left:0;top:0;height:3px;width:35%;background:var(--ica);border-radius:12px 3px 3px 0;animation:ldb 1s ease-in-out infinite}
@keyframes ldb{0%{left:0}100%{left:65%}}
.widget.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--ica)}100%{box-shadow:var(--shadow)}}
.wtb{position:absolute;top:-17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:3px;box-shadow:var(--pop);opacity:0;pointer-events:none;transition:opacity .12s;z-index:6;white-space:nowrap}
.widget.wsel>.wtb{opacity:1;pointer-events:auto}
.tbi{width:30px;height:30px;display:grid;place-items:center;border:0;background:none;border-radius:7px;color:var(--ic);cursor:pointer}
.tbi:hover{background:var(--sf2);color:var(--tx)}.tbi.grip{cursor:grab;touch-action:none}
.tbsep{width:1px;height:18px;background:var(--bs);margin:0 3px}
.lr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bs)}.lr:first-child{border-top:0;padding-top:2px}
.lm{width:84px;flex:none}.lg{flex:1;min-width:0}.lg b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lg small{color:var(--tx3);font-size:12px;display:block}
.evi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}.evi.crit{background:var(--cb);color:var(--cc)}.evi.warn{background:var(--wnb);color:var(--wnc)}.evi.info{background:var(--infb);color:var(--inft)}
.acked{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx3);white-space:nowrap}
.kv{margin:0;display:grid}.kv div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bs);font-size:13px}.kv div:first-child{border-top:0}.kv dt{color:var(--tx3)}.kv dd{margin:0;font-weight:500;text-align:right}
.cw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dn1{font-size:22px;font-weight:600;fill:var(--tx)}.dn2{font-size:11px;fill:var(--tx3)}
.lgd{flex:1;min-width:130px;display:grid;gap:6px}.lgr{display:flex;align-items:center;gap:8px;font-size:13px}.lgr b{margin-left:auto;font-weight:600}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}.big small{font-size:13px;font-weight:400;color:var(--tx3);letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{padding:3px 9px;border-radius:99px;background:var(--sf2);border:1px solid var(--bs);font-size:12px}
.mt{margin-bottom:12px}.mt .mrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;align-items:center}.mt .mrow b{font-weight:600;display:flex;gap:5px;align-items:center}
.live{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;color:#fff;font-size:11px;border:0;padding:0;cursor:pointer;text-align:left;display:block;width:100%}
.tile .tl{position:absolute;left:8px;bottom:6px;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.6)}.tile .tr{position:absolute;right:8px;top:6px;display:flex;gap:4px;align-items:center;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:99px}

 return `<div class="mhd">${u.length?u.length+' unacknowledged alarm'+(u.length>1?'s':''):'No unacknowledged alarms'}</div>${u.slice(0,5).map(x=>`<div class="lr isr" data-act="event" data-id="${x.id}" role="button" tabindex="0" style="padding:8px 10px;border-top:0"><span class="evi ${x.sev}">${I(x.sev==='crit'?'alert':'warn',16)}</span><div class="lg"><b>${esc(x.type)}</b><small>${esc(x.src)}, ${ago(x.at)}</small></div><button class="btn sm" data-act="ack" data-id="${x.id}">Acknowledge</button></div>`).join('')}<div class="msep"></div><button class="mi" data-act="go" data-p="alarms">${I('list',16)}<span>View all alarms</span></button>`}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-mi]');if(m&&S.modal){const cur=S.modal,b=cur.btns[+m.dataset.mi];if(b&&b.fn()!==false&&S.modal===cur)closeModal();return}
 if(justDragged){e.preventDefault();return}
 let t=e.target.closest('[data-act]');const wd=e.target.closest('.widget');
 if(t&&t.dataset.act==='event'&&e.target.closest('[data-act="ack"]'))t=e.target.closest('[data-act="ack"]');
 if(!e.target.closest('.menu')||(t&&t.dataset.act!=='ack'))closeMenu();
 if(!e.target.closest('.menu,.drawer,.scrim,#toasts,#sheet')&&(!wd||(!t&&!e.target.closest('button,a,input,textarea,select,label')))){const id=wd?wd.dataset.wid:null;S.sel=wd&&S.sel!==id?id:null;document.querySelectorAll('.widget.wsel').forEach(x=>x.classList.remove('wsel'));if(S.sel&&wd)wd.classList.add('wsel')}
 if(!t||!A[t.dataset.act])return;A[t.dataset.act](t.dataset,t,e)});
document.addEventListener('submit',e=>{if(e.target.id==='lf'){e.preventDefault();doLogin()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='dsdef'&&S.dset)S.dset.def=t.checked;
 if(t.id==='lr')S.lg.rem=t.checked;
 if(t.dataset.cfgk&&S.cfg)S.cfg.vals[t.dataset.cfgk]=t.checked;
 if(t.dataset.cfgm&&S.cfg){const k=t.dataset.cfgm,max=+t.dataset.max,set=new Set(S.cfg.vals[k]||[]);
  if(t.checked){if(max&&set.size>=max){t.checked=false;$('#cfgerr').textContent='You can show up to '+max+' cameras. Clear one to choose another.';return}set.add(t.value)}else set.delete(t.value);
  $('#cfgerr').textContent='';S.cfg.vals[k]=Array.from(set)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.note){const w=activeDash().widgets.find(x=>x.id===t.dataset.note);if(w)w.text=t.value;clearTimeout(noteT);noteT=setTimeout(persist,400)}
 if(t.id==='cfgtitle'&&S.cfg)S.cfg.title=t.value;
 if(t.id==='dsname'&&S.dset){S.dset.name=t.value;$('#dsct').textContent=t.value.length+'/30';$('#dserr').textContent='';t.classList.remove('bad')}
 if(t.id==='libq'){S.lib.q=t.value;$('#liblist').innerHTML=libList()}
 if(t.id==='dn'){$('#dnct').textContent=t.value.length+'/30';$('#dnerr').textContent='';t.classList.remove('bad')}
 if(/^pw[012]$/.test(t.id)){t.classList.remove('bad');const pe=$('#pwerr');if(pe)pe.textContent=''}
 if((t.id==='lu'||t.id==='lp')&&(S.lg.eu||S.lg.ep)){t.classList.remove('bad');const fe=t.closest('.fg').querySelector('.fe');if(fe)fe.remove();if(t.id==='lu')S.lg.eu='';else S.lg.ep=''}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#menu').firstChild)closeMenu();else if(S.modal)closeModal();else if(S.sheet)closeSheet();else if(S.drawer)closeDrawer();else if(S.sel){S.sel=null;document.querySelectorAll('.widget.wsel').forEach(x=>x.classList.remove('wsel'))}else if(S.focus){S.focus=false;render()}return}
 if(e.key==='Tab'&&S.sheet){const f=[...document.querySelectorAll('#sheetPanel button')];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('isr')){e.preventDefault();e.target.click();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('widget')){e.preventDefault();const id=e.target.dataset.wid;S.sel=S.sel===id?null:id;document.querySelectorAll('.widget.wsel').forEach(x=>x.classList.remove('wsel'));if(S.sel)e.target.classList.add('wsel')}
 if(e.key==='Enter'&&S.dset&&e.target.id==='dsname'){e.preventDefault();A.dsSave()}
 if(e.key==='Enter'&&S.modal&&(e.target.id==='dn'||/^pw[012]$/.test(e.target.id))){e.preventDefault();const b=$('#modal .mf .btn.primary');if(b)b.click()}
 const g=e.target.closest&&e.target.closest('[data-grip]');if(g&&['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();A.wMove({id:g.dataset.id,d:(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:1,keep:1})}});

/* ---------- Drag to reorder ---------- */
let drag=null,justDragged=false;
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(!g||(e.pointerType==='mouse'&&e.button!==0))return;const wd=g.closest('.widget');drag={id:wd.dataset.wid,el:wd,g,pid:e.pointerId,sx:e.clientX,sy:e.clientY,started:false,over:null,before:true,vy:0};try{g.setPointerCapture(e.pointerId)}catch(x){}});
function startDrag(e){const d=drag,r=d.el.getBoundingClientRect(),gh=d.el.cloneNode(true);closeMenu();
 const tb=gh.querySelector('.wtb');if(tb)tb.remove();gh.classList.remove('wsel');gh.classList.add('dghost');gh.style.cssText='width:'+r.width+'px;height:'+r.height+'px;left:'+r.left+'px;top:'+r.top+'px';
 d.ox=e.clientX-r.left;d.oy=e.clientY-r.top;d.ghost=gh;document.body.appendChild(gh);
 d.line=document.createElement('div');d.line.className='dropline';d.line.style.display='none';document.body.appendChild(d.line);
 d.el.classList.add('dsrc');document.body.classList.add('dragging');d.started=true;
 d.timer=setInterval(()=>{const c=$('.content');if(c&&d.vy)c.scrollTop+=d.vy},16)}
function moveDrag(e){const d=drag;d.ghost.style.left=(e.clientX-d.ox)+'px';d.ghost.style.top=(e.clientY-d.oy)+'px';
 const c=$('.content'),cr=c.getBoundingClientRect();d.vy=e.clientY<cr.top+70?-14:e.clientY>cr.bottom-70?14:0;
 const t=document.elementFromPoint(e.clientX,e.clientY),wd=t&&t.closest&&t.closest('.widget:not(.dsrc)');
 if(!wd)return;const r=wd.getBoundingClientRect(),g=wd.parentNode.getBoundingClientRect(),horiz=r.width<g.width*.95,before=horiz?e.clientX<r.left+r.width/2:e.clientY<r.top+r.height/2,L=d.line.style;
 d.over=wd.dataset.wid;d.before=before;L.display='block';
 if(horiz){L.width='4px';L.height=r.height+'px';L.top=r.top+'px';L.left=(before?r.left-10:r.right+6)+'px'}else{L.height='4px';L.width=r.width+'px';L.left=r.left+'px';L.top=(before?r.top-10:r.bottom+6)+'px'}}
function endDrag(e,commit){const d=drag;if(!d||(e.pointerId!==undefined&&e.pointerId!==d.pid))return;drag=null;try{d.g.releasePointerCapture(d.pid)}catch(x){}
 if(!d.started)return;clearInterval(d.timer);d.ghost.remove();d.line.remove();d.el.classList.remove('dsrc');document.body.classList.remove('dragging');
 justDragged=true;setTimeout(()=>{justDragged=false},60);
 if(commit&&d.over&&d.over!==d.id){const a=activeDash().widgets,from=a.findIndex(x=>x.id===d.id),it=a.splice(from,1)[0];let to=a.findIndex(x=>x.id===d.over);if(!d.before)to++;a.splice(to,0,it);
  S.flash=it.id;S.sel=it.id;persist();render();announce(wName(it)+' moved to position '+(to+1)+' of '+a.length);return}
 render()}
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;if(!drag.started){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;startDrag(e)}moveDrag(e)});
document.addEventListener('pointerup',e=>endDrag(e,true));
document.addEventListener('pointercancel',e=>endDrag(e,false));
window.addEventListener('resize',()=>{placeToasts();closeMenu()});

/* ---------- Timers & init ---------- */
setInterval(()=>{
 if(!S.user){if(S.lg.lockUntil){if(Date.now()>=S.lg.lockUntil){S.lg.lockUntil=0;S.lg.attempts=0;S.lg.err='';render()}else{const x=$('#lerrt');if(x)x.textContent=lockText()}}return}
 syncUpd();const d=activeDash(),ri=d&&refreshOf(d);if(S.page==='dashboard'&&ri&&!paused()&&!S.offline&&!S.loading&&!S.sheet&&Date.now()-S.last>=ri*1000)refresh()},1000);
(function init(){const th=store.get('nvr_theme_v3');if(th&&THEMES.some(t=>t[0]===th))document.documentElement.dataset.nvr=th;
 const su=store.get('nvr_session3');if(su&&USERS[su])loadUser(su);render()})();
window.__nvr={S,A,render};
})();
